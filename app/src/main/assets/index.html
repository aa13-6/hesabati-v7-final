<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08785c">
<title>حساباتي</title>
<style>
:root{--green:#08785c;--green2:#e7f5ef;--line:#d7e5e1;--ink:#142b3e;--muted:#637b89;--blue:#2563eb;--red:#dc2626;--bg:#f4f8f7;--panel:#ffffff;--tablehead:#edf7f3;--totalbg:#e2f3ec;--softbg:#edf3f5;--inputbg:#ffffff;--inputborder:#cddde4;--noticebg:#eff8f4;--noticetext:#35695a}
body.theme-blue{--green:#2459a9;--green2:#e8f0ff;--line:#d6e1f4;--ink:#182b47;--muted:#62758f;--bg:#f3f6fc;--tablehead:#e8f0ff;--totalbg:#dce8ff;--softbg:#edf2fb;--inputbg:#ffffff;--inputborder:#c4d4ec;--noticebg:#edf4ff;--noticetext:#244a80}
body.theme-purple{--green:#7042a6;--green2:#f0e8fb;--line:#e2d7ef;--ink:#30233d;--muted:#766783;--bg:#f8f5fb;--tablehead:#f0e8fb;--totalbg:#e9dcf8;--softbg:#f2edf8;--inputbg:#ffffff;--inputborder:#d8c8e9;--noticebg:#f4eefb;--noticetext:#563b78}
body.theme-dark{--green:#172b3b;--green2:#294252;--line:#425563;--ink:#f2f6f9;--muted:#c0cdd5;--bg:#101a22;--panel:#192832;--tablehead:#263d4b;--totalbg:#294638;--softbg:#263a47;--inputbg:#223541;--inputborder:#536a78;--noticebg:#203b35;--noticetext:#c4e8d9}
body.theme-sand{--green:#8b6338;--green2:#f7ead6;--line:#e6d7c1;--ink:#3e3021;--muted:#88765f;--bg:#faf5ec;--tablehead:#f7ead6;--totalbg:#eee0c8;--softbg:#f4ecdf;--inputbg:#ffffff;--inputborder:#ddcbb0;--noticebg:#f7eddd;--noticetext:#6d4c2c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif} .card,.account,.modal,.tablewrap,table,.menuitem{background:var(--panel,#fff);color:var(--ink)} th{background:var(--tablehead)} tfoot td{background:var(--totalbg)}button,input,select{font:inherit}button{cursor:pointer}input::placeholder{color:var(--muted);opacity:1}td{color:var(--ink)}.account:focus-visible,.themechoice:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
header{background:var(--green);color:white;padding:17px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
.brand{font-size:21px;font-weight:700}.subtitle{font-size:12px;opacity:.85;margin-top:4px}.iconbtn{border:0;border-radius:12px;background:#ffffff20;color:white;min-width:42px;height:42px;font-size:22px}
main{max-width:1000px;margin:auto;padding:14px 12px 95px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 6px #153e3210}
.account{width:100%;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:16px;display:flex;align-items:center;gap:12px;text-align:right;margin:10px 0;color:var(--ink);min-height:68px}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--green2);display:grid;place-items:center;color:var(--green);font-size:21px;flex-shrink:0}
.account .name{font-weight:700;flex:1}.arrow{color:var(--green);font-size:20px}
.primary,.secondary,.danger{border:0;border-radius:12px;padding:12px 16px;font-weight:700}.primary{background:var(--green);color:white}.secondary{background:var(--softbg);color:var(--ink);border:1px solid var(--line)}.danger{background:var(--red);color:white}.wide{width:100%}
.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;left:14px;max-width:972px;margin:auto;border-radius:16px;box-shadow:0 5px 18px #003b2a35;font-size:16px}
h2{font-size:20px;margin:8px 0 4px}.sectiontitle{font-weight:700;margin:18px 0 8px}
.tablewrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:800px;background:var(--panel);font-size:13px}th,td{border:1px solid var(--line);padding:10px 7px;text-align:center;white-space:nowrap}th{background:var(--tablehead);font-weight:700}tfoot td{background:var(--totalbg);color:var(--ink);font-weight:700;border:2px solid var(--line)}.blue{color:var(--blue);font-weight:700}.red{color:var(--red);font-weight:700}.actions{display:flex;justify-content:center;gap:5px}.mini{width:32px;height:32px;border-radius:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-size:17px}.mini.edit{color:var(--green)}.mini.delete{color:var(--red)}
.modalback{position:fixed;inset:0;background:#0b1d2a80;display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0}
.modal{background:var(--panel);color:var(--ink);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0002}
.modal h3{margin:0 0 16px;font-size:19px}.field{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:center;gap:10px;margin:10px 0}.field label{font-weight:700;text-align:right}.field:has(input:first-child) label,.field:has(select:first-child) label{grid-column:1;grid-row:1}.field:has(input:first-child) input,.field:has(select:first-child) input,.field:has(select:first-child) select{grid-column:2;grid-row:1}.field label:first-child{grid-column:1;grid-row:1}.field label:first-child+input,.field label:first-child+select{grid-column:2;grid-row:1}.field input,.field select{width:100%;min-width:0;border:1px solid #cddde4;border-radius:10px;padding:12px 10px;background:var(--inputbg);color:var(--ink);border-color:var(--inputborder);outline-color:var(--green)}.field input[readonly]{background:var(--panel);color:var(--red);font-weight:700;border-color:var(--red)}.modalbuttons{display:flex;gap:10px;margin-top:18px}.modalbuttons>*{flex:1}
.menuitem{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;margin:8px 0;text-align:right}
.settingrow{padding:13px 0;border-bottom:1px solid var(--line)}.themegrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.themechoice{display:flex;align-items:center;gap:10px;text-align:right;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel,#fff);color:var(--ink)}.themechoice.chosen{border:2px solid var(--green);font-weight:700}.themechoice span:nth-child(2){flex:1}.swatch{width:28px;height:28px;border-radius:9px;border:1px solid #0002;display:inline-block}@media(min-width:500px){.themegrid{grid-template-columns:1fr 1fr}}.typeitem{display:flex;align-items:center;gap:8px;margin:8px 0}.typeitem span{flex:1}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}.notice{background:var(--noticebg);border-radius:12px;padding:12px;color:var(--noticetext);font-size:12px;line-height:1.7}
@media(min-width:650px){.modalback{align-items:center;padding:16px}.modal{border-radius:20px}.fab{left:auto;width:260px}main{padding-top:22px}}
.advance-summary th,.advance-summary td{border:2px solid var(--line);padding:12px 8px;text-align:center}
.advance-summary th{font-weight:700;background:var(--green2)}
#lockScreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lockCard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 18px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 30px #0002}
.lockIcon{font-size:48px;margin-bottom:12px}
.switch{position:relative;display:inline-block;width:50px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#ccc;border-radius:28px;transition:.3s}.slider:before{content:"";position:absolute;height:20px;width:20px;left:4px;bottom:4px;background:white;border-radius:50%;transition:.3s}.switch input:checked + .slider{background:var(--green)}.switch input:checked + .slider:before{transform:translateX(22px)}
</style>
</head>
<body>
<div id="lockScreen" class="hidden">
  <div class="lockCard">
    <div class="lockIcon">🔒</div>
    <h2>حساباتي محمي</h2>
    <p class="muted">أدخل كلمة المرور للمتابعة</p>
    <div class="field" style="grid-template-columns:1fr"><input id="lockInput" type="password" placeholder="كلمة المرور" style="text-align:center;font-size:18px;letter-spacing:2px"></div>
    <button class="primary wide" id="unlockBtn" style="margin-top:12px">فتح 🔓</button>
    <p class="muted" id="lockError" style="color:var(--red);margin-top:10px;display:none">كلمة المرور غير صحيحة</p>
  </div>
</div>
<header>
 <div><div class="brand" id="headerTitle">حساباتي</div><div class="subtitle" id="headerSub">إدارة الحسابات والدفاتر</div></div>
 <div class="row"><button class="iconbtn" id="settingsBtn">⚙</button><button class="iconbtn" id="backBtn" style="display:none">‹</button></div>
</header>
<main id="app"></main>
<button id="mainFab" class="primary fab">＋ إضافة حساب</button>
<div id="modalHost"></div>
<script>
const KEY='hesabati_data_v1';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const localDateTimeNow=()=>{const d=new Date();return `${todayISO()}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`};
const dayName=(iso)=>{if(!iso)return '';const d=new Date(iso+'T12:00:00');return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()]};
const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
let data={accounts:[],types:['بضاعة','خدمة','تركيب','أخرى'],settings:{theme:'green',lockEnabled:false,lockPass:'',emergencyPass:''},nextId:1};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.accounts))data={...data,...saved,settings:{...data.settings,...(saved.settings||{})}}}catch(e){}
let view='accounts',activeId=null,longTimer=null,longTriggered=false;
function applyTheme(){const t=data.settings?.theme||'green';document.body.classList.remove('theme-blue','theme-purple','theme-dark','theme-sand');if(t!=='green')document.body.classList.add('theme-'+t);}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('تعذر الحفظ')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const account=()=>data.accounts.find(a=>a.id===activeId);
const total=a=>(a?.entries||[]).reduce((t,e)=>({count:t.count+(Number(e.count)||0),price:t.price+(Number(e.price)||0),paid:t.paid+(Number(e.paid)||0),remaining:t.remaining+((Number(e.price)||0)-(Number(e.paid)||0))}),{count:0,price:0,paid:0,remaining:0});
function advanceState(a){if(!Array.isArray(a.advances)){a.advances=[];if(a.advance && Number(a.advance.amount)>0){a.advances.push({id:'adv'+Date.now(),amount:Math.max(0,Number(a.advance.amount)||0),date:a.advance.date||todayISO(),remaining:Math.max(0,Number(a.advance.remaining??a.advance.amount)||0)});}delete a.advance;}a.advances.forEach((adv,i)=>{if(!adv.id)adv.id='adv'+i+'_'+Date.now();adv.amount=Math.max(0,Number(adv.amount)||0);if(!adv.date)adv.date=todayISO();if(!Number.isFinite(Number(adv.remaining)))adv.remaining=adv.amount;});return a.advances;}
function recalculateAdvance(a){const advances=advanceState(a).map((adv,index)=>({...adv,_order:index,_when:adv.createdAt||((adv.date||todayISO())+'T23:59:59')})).sort((x,y)=>String(x._when).localeCompare(String(y._when))||x._order-y._order);advances.forEach(adv=>{adv.remaining=Math.max(0,Number(adv.amount)||0)});const entries=(a.entries||[]).map((e,index)=>({...e,_order:index,_when:e.createdAt||((e.date||todayISO())+'T23:59:59')})).sort((x,y)=>String(x._when).localeCompare(String(y._when))||x._order-y._order);entries.forEach(e=>{if(e.basePaid===undefined || e.basePaid===null || !Number.isFinite(Number(e.basePaid))) e.basePaid=Math.max(0,Number(e.paid)||0);e.basePaid=Math.max(0,Number(e.basePaid)||0);e.paid=e.basePaid;delete e._advanceApplied;});entries.forEach(e=>{let due=Math.max(0,(Number(e.price)||0)-e.basePaid);if(due<=0)return;for(const adv of advances){if(String(e._when)<=String(adv._when))continue;if(due<=0)break;const left=Math.max(0,Number(adv.remaining)||0);if(left<=0)continue;const used=Math.min(left,due);e.paid+=used;adv.remaining=left-used;due-=used;}});entries.forEach(e=>{const original=a.entries.find(x=>x.id===e.id);if(original){original.paid=e.paid;}});advances.forEach(adv=>{const original=advanceState(a).find(x=>x.id===adv.id);if(original)original.remaining=adv.remaining;});}
function checkLock(){const lockEnabled=data.settings?.lockEnabled;const pass=data.settings?.lockPass;if(lockEnabled && pass){document.getElementById('lockScreen').classList.remove('hidden');return true;}else{document.getElementById('lockScreen').classList.add('hidden');return false;}}
function unlockApp(){
  const input=document.getElementById('lockInput').value;
  const pass=data.settings?.lockPass;
  const emer=data.settings?.emergencyPass;
  if(input===pass || (emer && emer!=='' && input===emer)){
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('lockError').style.display='none';
    document.getElementById('lockInput').value='';
    if(emer && input===emer){data.settings.lockEnabled=false;save();}
  }else{
    document.getElementById('lockError').style.display='block';
    document.getElementById('lockInput').value='';
  }
}
function header(){const a=account();document.getElementById('headerTitle').textContent=view==='accounts'?'حساباتي':view==='ledger'?(a?.name||'دفتر الحساب'):view==='settings'?'الإعدادات':'إدارة أنواع الحركات';document.getElementById('headerSub').textContent=view==='accounts'?'إدارة الحسابات والدفاتر':'';document.getElementById('backBtn').style.display=view==='accounts'?'none':'inline-block';document.getElementById('settingsBtn').style.display=view==='ledger'?'none':'inline-block';document.getElementById('mainFab').classList.toggle('hidden',view==='settings'||view==='types');document.getElementById('mainFab').textContent=view==='accounts'?'＋ إضافة حساب':'＋ إضافة حركة';}
function render(){applyTheme();header();const root=document.getElementById('app');if(view==='accounts')renderAccounts(root);else if(view==='ledger')renderLedger(root);else if(view==='settings')renderSettings(root);else renderTypes(root);}
function renderAccounts(root){if(!data.accounts.length){root.innerHTML='<div class="card empty"><div style="font-size:36px">▤</div><h2>ابدأ بإضافة أول حساب</h2><p>أنشئ دفترًا مستقلًا لكل شخص أو عميل.</p></div>';return}root.innerHTML=data.accounts.map(a=>`<button class="account" data-open="${a.id}"><span class="avatar">♙</span><span class="name">${esc(a.name)}</span><span class="arrow">‹</span></button>`).join('');root.querySelectorAll('[data-open]').forEach(el=>{const id=el.dataset.open;el.addEventListener('click',()=>{if(longTriggered){longTriggered=false;return}activeId=id;view='ledger';render()});el.addEventListener('contextmenu',e=>{e.preventDefault();showAccountMenu(id)});el.addEventListener('pointerdown',()=>{longTriggered=false;longTimer=setTimeout(()=>{longTriggered=true;showAccountMenu(id)},550)});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(longTimer)))})}
function renderLedger(root){const a=account();if(!a){view='accounts';render();return}recalculateAdvance(a);const advances=advanceState(a);const sum=total(a);const advanceRows=advances.length?advances.map(adv=>`<tr><td style="font-weight:700;color:var(--green)">${money(adv.amount)}</td><td>${esc(adv.date||'')}</td><td style="font-weight:700;color:var(--red)">${money(adv.remaining)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">لا توجد مبالغ مقدمة</td></tr>';const rows=(a.entries||[]).map((e,i)=>`<tr><td>${i+1}</td><td>${esc(dayName(e.date)||e.day||'')}</td><td>${esc(e.date||'')}</td><td>${esc(e.type||'')}</td><td>${money(e.count)}</td><td>${money(e.price)}</td><td class="blue">${money(e.paid)}</td><td class="red">${money((Number(e.price)||0)-(Number(e.paid)||0))}</td><td><div class="actions"><button class="mini edit" data-edit="${e.id}">✎</button><button class="mini delete" data-delete="${e.id}">♲</button></div></td></tr>`).join('');root.innerHTML=`<div class="row between" style="flex-wrap:wrap"><div class="row" style="flex-wrap:wrap;gap:8px"><button class="secondary" id="advanceBtn">＋ إضافة مبلغ مقدم</button><button class="secondary" id="reportBtn">▤ تقرير</button><button class="secondary" id="renameFromLedger">⋯</button></div><div style="flex:1;min-width:230px;overflow-x:auto"><table class="advance-summary" dir="rtl" style="width:100%;min-width:300px;border-collapse:collapse;background:var(--panel)"><thead><tr><th>المبلغ المقدم</th><th>التاريخ</th><th>المتبقي</th></tr></thead><tbody>${advanceRows}</tbody></table></div></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>رقم</th><th>اليوم</th><th>التاريخ</th><th>النوع</th><th>العدد</th><th>السعر</th><th>مسلم</th><th>باقي</th><th>الإجراءات</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">لا توجد حركات بعد</td></tr>'}</tbody><tfoot><tr><td colspan="4">الإجمالي</td><td>${money(sum.count)}</td><td>${money(sum.price)}</td><td class="blue">${money(sum.paid)}</td><td class="red">${money(sum.remaining)}</td><td>—</td></tr></tfoot></table></div>`;root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEntry(b.dataset.edit));root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirmDeleteEntry(b.dataset.delete));document.getElementById('renameFromLedger').onclick=()=>showAccountMenu(a.id);document.getElementById('reportBtn').onclick=()=>openReport(a);document.getElementById('advanceBtn').onclick=()=>openAdvance(a)}
function openAdvance(a){openModal(`<h3>إضافة مبلغ مقدم جديد</h3><div class="field"><input id="advanceAmount" type="number" min="0.01" step="0.01" placeholder="أدخل المبلغ" required><label>المبلغ :-</label></div><div class="field"><input id="advanceDate" type="date" value="${todayISO()}" readonly><label>تاريخ المقدم :-</label></div><div class="modalbuttons"><button class="primary" id="saveAdvance">حفظ</button><button class="secondary" id="cancelAdvance">إلغاء</button></div>`);document.getElementById('cancelAdvance').onclick=closeModal;document.getElementById('saveAdvance').onclick=()=>{const amount=Number(document.getElementById('advanceAmount').value),date=todayISO();if(!Number.isFinite(amount)||amount<=0){alert('أدخل مبلغ');return}const advances=advanceState(a);(a.entries||[]).forEach(e=>{if(e.basePaid===undefined)e.basePaid=Math.max(0,Number(e.paid)||0)});advances.push({id:'adv'+Date.now(),amount,date,createdAt:localDateTimeNow(),remaining:amount});recalculateAdvance(a);save();closeModal();render();};}
function openReport(a){recalculateAdvance(a);const sum=total(a);const rows=[...a.entries].map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.date||'')}</td><td>${esc(dayName(e.date)||e.day||'')}</td><td>${esc(e.type||'')}</td><td>${money(e.count)}</td><td>${money(e.price)}</td><td>${money(e.paid)}</td><td>${money((Number(e.price)||0)-(Number(e.paid)||0))}</td></tr>`).join('');openModal(`<div id="reportContent"><h3 style="text-align:center">تقرير حساب: ${esc(a.name)}</h3><div class="tablewrap"><table style="min-width:600px"><thead><tr><th>رقم</th><th>التاريخ</th><th>اليوم</th><th>النوع</th><th>العدد</th><th>السعر</th><th>مسلم</th><th>باقي</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="4">الإجمالي</td><td>${money(sum.count)}</td><td>${money(sum.price)}</td><td>${money(sum.paid)}</td><td>${money(sum.remaining)}</td></tr></tfoot></table></div></div><div class="modalbuttons"><button class="primary" id="printReport">طباعة</button><button class="secondary" id="closeReport">إغلاق</button></div>`);document.getElementById('closeReport').onclick=closeModal;document.getElementById('printReport').onclick=()=>{const content=document.getElementById('reportContent').innerHTML;const w=window.open('','_blank');w.document.write(`<html dir="rtl"><body>${content}<script>window.print()<\/script></body></html>`);w.document.close()}}
function renderSettings(root){
  const current=data.settings?.theme||'green';
  const themes=[['green','أخضر زمردي','#08785c'],['blue','أزرق هادئ','#2459a9'],['purple','بنفسجي أنيق','#7042a6'],['sand','رملي دافئ','#8b6338'],['dark','داكن ليلي','#172b3b']];
  const lockEnabled=data.settings?.lockEnabled||false;
  const lockPass=data.settings?.lockPass||'';
  const emerPass=data.settings?.emergencyPass||'';
  root.innerHTML=`<div class="card"><div class="settingrow"><div class="row between"><div><b>🔒 قفل التطبيق بكلمة مرور</b><br><small class="muted">سيطلب كلمة مرور عند فتح التطبيق</small></div><label class="switch"><input type="checkbox" id="lockToggle" ${lockEnabled?'checked':''}><span class="slider"></span></label></div>
  <div id="lockFields" class="${lockEnabled?'':'hidden'}" style="margin-top:14px">
    <div class="field"><input id="lockPassInput" type="password" value="${esc(lockPass)}" placeholder="مثال: 1234"><label>الأساسية :-</label></div>
    <div class="field"><input id="emergencyPassInput" type="password" value="${esc(emerPass)}" placeholder="اتركه فاضي لإلغاء الطوارئ"><label>الطوارئ :-</label></div>
    <div class="row" style="gap:8px;margin-top:8px"><button class="primary" id="saveLock">حفظ القفل</button><button class="secondary" id="disableLock">إلغاء القفل</button></div>
    <p class="notice" style="margin-top:10px">• الأساسية: تفتح التطبيق<br>• الطوارئ: انت تحددها، تفتح بها اذا نسيت الأساسية (اتركها فاضية اذا ما تبي طوارئ)</p>
  </div></div>
  <button class="menuitem" id="typesPage"><span>☷</span><span><b>إدارة أنواع الحركات</b></span><span>‹</span></button>
  <div class="settingrow"><b>مظهر التطبيق</b><div class="themegrid">${themes.map(([id,name,color])=>`<button class="themechoice ${current===id?'chosen':''}" data-theme="${id}"><span class="swatch" style="background:${color}"></span><span>${name}</span><span>${current===id?'✓':''}</span></button>`).join('')}</div></div></div>`;
  document.getElementById('typesPage').onclick=()=>{view='types';render()};
  root.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{data.settings.theme=b.dataset.theme;save();render()});
  const toggle=document.getElementById('lockToggle');
  const fields=document.getElementById('lockFields');
  toggle.onchange=()=>{
    fields.classList.toggle('hidden',!toggle.checked);
    if(!toggle.checked){data.settings.lockEnabled=false;save();render();}
  };
  document.getElementById('saveLock').onclick=()=>{
    const p=document.getElementById('lockPassInput').value.trim();
    const ep=document.getElementById('emergencyPassInput').value.trim();
    if(!p){alert('اكتب كلمة مرور أساسية');return}
    if(ep && ep===p){alert('كلمة الطوارئ يجب أن تكون مختلفة عن الأساسية');return}
    data.settings.lockPass=p;
    data.settings.emergencyPass=ep;
    data.settings.lockEnabled=true;
    save();
    alert('تم تفعيل القفل ✅');
    render();
  };
  document.getElementById('disableLock').onclick=()=>{
    if(confirm('إلغاء القفل؟')){
      data.settings.lockEnabled=false;
      data.settings.lockPass='';
      save();
      render();
    }
  };
}
function renderTypes(root){root.innerHTML=`<div class="card"><div class="row between"><h2>أنواع الحركات</h2><button class="primary" id="addType">＋ إضافة نوع</button></div><div id="typesList">${data.types.map((t,i)=>`<div class="typeitem"><span>${esc(t)}</span><button class="mini edit" data-typeedit="${i}">✎</button><button class="mini delete" data-typedelete="${i}">♲</button></div>`).join('')}</div></div>`;document.getElementById('addType').onclick=()=>openType();root.querySelectorAll('[data-typeedit]').forEach(b=>b.onclick=()=>openType(Number(b.dataset.typeedit)));root.querySelectorAll('[data-typedelete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.typedelete);openConfirm('حذف النوع',`هل تريد حذف النوع «${data.types[i]}» ؟`,()=>{data.types.splice(i,1);save();render()})})}
function openModal(content){document.getElementById('modalHost').innerHTML=`<div class="modalback" id="modalback"><section class="modal">${content}</section></div>`;document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()})}
function closeModal(){document.getElementById('modalHost').innerHTML='';}
function handleBack(){if(document.getElementById('modalback')){closeModal();return}if(view==='ledger'){view='accounts';activeId=null}else if(view==='types'){view='settings'}else if(view==='settings'){view='accounts'}else{return}render()}
function showAccountMenu(id){const a=data.accounts.find(x=>x.id===id);if(!a)return;openModal(`<h3>${esc(a.name)}</h3><button class="menuitem" id="renameAccount">✎ إعادة التسمية</button><button class="menuitem" id="deleteAccount" style="color:var(--red)">♲ حذف الحساب</button><button class="secondary wide" id="cancelMenu">إلغاء</button>`);document.getElementById('renameAccount').onclick=()=>{closeModal();openRename(id)};document.getElementById('deleteAccount').onclick=()=>{closeModal();openConfirm('حذف الحساب',`هل تريد حذف «${a.name}» ؟`,()=>{data.accounts=data.accounts.filter(x=>x.id!==id);if(activeId===id){activeId=null;view='accounts'}save();render()})};document.getElementById('cancelMenu').onclick=closeModal}
function openRename(id){const a=data.accounts.find(x=>x.id===id);openModal(`<h3>إعادة تسمية</h3><div class="field"><input id="renameValue" value="${esc(a.name)}"><label>الاسم :-</label></div><div class="modalbuttons"><button class="primary" id="saveRename">حفظ</button><button class="secondary" id="cancelRename">إلغاء</button></div>`);document.getElementById('saveRename').onclick=()=>{const n=document.getElementById('renameValue').value.trim();if(!n){alert('اكتب اسم');return}a.name=n;save();closeModal();render()};document.getElementById('cancelRename').onclick=closeModal}
function openEntry(id=null){
  const a=account();
  const old=id?(a.entries||[]).find(e=>e.id===id):null;
  const date=old?.date||todayISO();
  const options=data.types.map(t=>`<option ${t===(old?.type||data.types[0])?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('');
  openModal(`<h3>${old?'تعديل حركة':'إضافة حركة'} — ${esc(a.name)}</h3><form id="entryForm"><div class="field"><select id="entryDay">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map(d=>`<option ${d===dayName(date)?'selected':''}>${d}</option>`).join('')}</select><label>اليوم :-</label></div><div class="field"><input id="entryDate" type="date" value="${date}" required><label>التاريخ :-</label></div><div class="field"><select id="entryType">${options}</select><label>النوع :-</label></div><div class="field"><input id="entryCount" type="number" min="0" step="1" value="${old!=null?esc(old.count):'0'}" required><label>العدد :-</label></div><div class="field"><input id="entryPrice" type="number" min="0" step="1" value="${old!=null?esc(old.price):'0'}" required><label>السعر :-</label></div><div class="field"><input id="entryPaid" type="number" min="0" step="1" value="${old!=null?esc(old.paid):'0'}" required><label>مسلم :-</label></div><div class="field"><input id="entryRemaining" readonly value="${money((Number(old?.price)||0)-(Number(old?.paid)||0))}"><label>باقي :-</label></div><div class="modalbuttons"><button class="primary" type="submit">حفظ</button><button class="secondary" type="button" id="cancelEntry">إلغاء</button></div></form>`);
  const dateEl=document.getElementById('entryDate'),dayEl=document.getElementById('entryDay');
  dateEl.onchange=()=>{if(dateEl.value)dayEl.value=dayName(dateEl.value)};
  const update=()=>{document.getElementById('entryRemaining').value=money((Number(document.getElementById('entryPrice').value)||0)-(Number(document.getElementById('entryPaid').value)||0))};
  document.getElementById('entryPrice').oninput=update;
  document.getElementById('entryPaid').oninput=update;
  document.getElementById('cancelEntry').onclick=closeModal;
  document.getElementById('entryForm').onsubmit=e=>{
    e.preventDefault();
    const p=Number(document.getElementById('entryPrice').value);
    const paid=Number(document.getElementById('entryPaid').value);
    const cnt=Number(document.getElementById('entryCount').value);
    if(!Number.isFinite(p) || p<0){alert('السعر يجب أن يكون أكبر من أو يساوي صفر');return}
    if(!Number.isFinite(paid) || paid<0){alert('المسلم يجب أن يكون أكبر من أو يساوي صفر');return}
    if(!Number.isFinite(cnt) || cnt<0){alert('العدد يجب أن يكون أكبر من أو يساوي صفر');return}
    if(paid>p){if(!confirm('المسلم أكبر من السعر، متابعة؟'))return}
    const entry={
      id:old?.id||('e'+Date.now()),
      day:dayEl.value,
      date:dateEl.value,
      createdAt:old?.createdAt||localDateTimeNow(),
      type:document.getElementById('entryType').value,
      count:cnt||0,
      price:p,
      paid:paid,
      basePaid:paid
    };
    if(old){
      const idx=a.entries.findIndex(e=>e.id===old.id);
      if(idx>=0) a.entries[idx]=entry;
    }else{
      a.entries.push(entry)
    }
    recalculateAdvance(a);
    save();
    closeModal();
    render()
  }
}
function confirmDeleteEntry(id){openConfirm('تأكيد حذف الحركة','هل أنت متأكد من حذف هذه الحركة؟',()=>{const a=account();a.entries=a.entries.filter(e=>e.id!==id);save();render()})}
function openConfirm(title,body,yes){openModal(`<h3 style="text-align:center">${esc(title)}</h3><p style="text-align:center">${esc(body)}</p><div class="modalbuttons"><button class="danger" id="confirmYes">تأكيد</button><button class="secondary" id="confirmNo">إلغاء</button></div>`);document.getElementById('confirmYes').onclick=()=>{closeModal();yes()};document.getElementById('confirmNo').onclick=closeModal}
function openType(index=null){const old=index===null?'':data.types[index];openModal(`<h3>${index===null?'إضافة نوع جديد':'تعديل النوع'}</h3><div class="field"><input id="typeValue" value="${esc(old)}"><label>النوع :-</label></div><div class="modalbuttons"><button class="primary" id="typeSave">حفظ</button><button class="secondary" id="typeCancel">إلغاء</button></div>`);document.getElementById('typeSave').onclick=()=>{const v=document.getElementById('typeValue').value.trim();if(!v){alert('أدخل اسم النوع');return}if(index===null)data.types.push(v);else data.types[index]=v;save();closeModal();render()};document.getElementById('typeCancel').onclick=closeModal}
document.getElementById('mainFab').onclick=()=>{if(view==='accounts'){openModal(`<h3>إضافة حساب جديد</h3><div class="field"><label>الاسم :-</label><input id="newAccountName" placeholder="مثال: حساب علي"></div><div class="modalbuttons"><button class="primary" id="createAccount">حفظ</button><button class="secondary" id="cancelAccount">إلغاء</button></div>`);document.getElementById('createAccount').onclick=()=>{const name=document.getElementById('newAccountName').value.trim();if(!name){alert('اكتب اسم الحساب');return}const a={id:'a'+Date.now(),name,entries:[]};data.accounts.push(a);activeId=a.id;save();closeModal();view='ledger';render()};document.getElementById('cancelAccount').onclick=closeModal}else if(view==='ledger')openEntry()};
document.getElementById('settingsBtn').onclick=()=>{view='settings';render()};document.getElementById('backBtn').onclick=handleBack;
document.getElementById('unlockBtn').onclick=unlockApp;
document.getElementById('lockInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlockApp()});
function handleAndroidBack(){
  if(document.getElementById('modalback')){
    closeModal();
    return true;
  }
  if(view !== 'accounts'){
    handleBack();
    return true;
  }
  return false;
}
render();
checkLock();
window.addEventListener('popstate', function(){ handleAndroidBack(); });
</script>
</body>
</html>
