<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08785c">
<title>حساباتي</title>
<style>
:root{--green:#08785c;--green2:#e7f5ef;--line:#d7e5e1;--ink:#142b3e;--muted:#637b89;--blue:#2563eb;--red:#dc2626;--bg:#f4f8f7;--panel:#ffffff;--tablehead:#edf7f3;--totalbg:#e2f3ec;--softbg:#edf3f5;--inputbg:#ffffff;--inputborder:#cddde4;--noticebg:#eff8f4;--noticetext:#35695a}
body.theme-blue{--green:#2459a9;--green2:#e8f0ff;--line:#d6e1f4;--ink:#182b47;--muted:#62758f;--bg:#f3f6fc;--tablehead:#e8f0ff;--totalbg:#dce8ff;--softbg:#edf2fb;--inputbg:#ffffff;--inputborder:#c4d4ec;--noticebg:#edf4ff;--noticetext:#244a80}
body.theme-purple{--green:#7042a6;--green2:#f0e8fb;--line:#e2d7ef;--ink:#30233d;--muted:#766783;--bg:#f8f5fb;--tablehead:#f0e8fb;--totalbg:#e9dcf8;--softbg:#f2edf8;--inputbg:#ffffff;--inputborder:#d8c8e9;--noticebg:#f4eefb;--noticetext:#563b78}
body.theme-dark{--green:#172b3b;--green2:#294252;--line:#425563;--ink:#f2f6f9;--muted:#c0cdd5;--bg:#101a22;--panel:#192832;--tablehead:#263d4b;--totalbg:#294638;--softbg:#263a47;--inputbg:#223541;--inputborder:#536a78;--noticebg:#203b35;--noticetext:#c4e8d9}
body.theme-sand{--green:#8b6338;--green2:#f7ead6;--line:#e6d7c1;--ink:#3e3021;--muted:#88765f;--bg:#faf5ec;--tablehead:#f7ead6;--totalbg:#eee0c8;--softbg:#f4ecdf;--inputbg:#ffffff;--inputborder:#ddcbb0;--noticebg:#f7eddd;--noticetext:#6d4c2c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif} .card,.account,.modal,.tablewrap,table,.menuitem{background:var(--panel,#fff);color:var(--ink)} th{background:var(--tablehead)} tfoot td{background:var(--totalbg)}button,input,select{font:inherit}button{cursor:pointer}input::placeholder{color:var(--muted);opacity:1}td{color:var(--ink)}.account:focus-visible,.themechoice:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
header{background:var(--green);color:white;padding:17px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
.brand{font-size:21px;font-weight:700}.subtitle{font-size:12px;opacity:.85;margin-top:4px}.iconbtn{border:0;border-radius:12px;background:#ffffff20;color:white;min-width:42px;height:42px;font-size:22px}
main{max-width:1000px;margin:auto;padding:14px 12px 95px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 6px #153e3210}
.account{width:100%;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:16px;display:flex;align-items:center;gap:12px;text-align:right;margin:10px 0;color:var(--ink);min-height:68px}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--green2);display:grid;place-items:center;color:var(--green);font-size:21px;flex-shrink:0}
.account .name{font-weight:700;flex:1}.arrow{color:var(--green);font-size:20px}
.primary,.secondary,.danger{border:0;border-radius:12px;padding:12px 16px;font-weight:700}.primary{background:var(--green);color:white}.secondary{background:var(--softbg);color:var(--ink);border:1px solid var(--line)}.danger{background:var(--red);color:white}.wide{width:100%}
.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;left:14px;max-width:972px;margin:auto;border-radius:16px;box-shadow:0 5px 18px #003b2a35;font-size:16px}
h2{font-size:20px;margin:8px 0 4px}.sectiontitle{font-weight:700;margin:18px 0 8px}
.tablewrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:800px;background:var(--panel);font-size:13px}th,td{border:1px solid var(--line);padding:10px 7px;text-align:center;white-space:nowrap}th{background:var(--tablehead);font-weight:700}tfoot td{background:var(--totalbg);color:var(--ink);font-weight:700;border:2px solid var(--line)}.blue{color:var(--blue);font-weight:700}.red{color:var(--red);font-weight:700}.actions{display:flex;justify-content:center;gap:5px}.mini{width:32px;height:32px;border-radius:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-size:17px}.mini.edit{color:var(--green)}.mini.delete{color:var(--red)}
.modalback{position:fixed;inset:0;background:#0b1d2a80;display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0}
.modal{background:var(--panel);color:var(--ink);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0002}
.modal h3{margin:0 0 16px;font-size:19px}.field{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:center;gap:10px;margin:10px 0}.field label{font-weight:700;text-align:right}.field:has(input:first-child) label,.field:has(select:first-child) label{grid-column:1;grid-row:1}.field:has(input:first-child) input,.field:has(select:first-child) input,.field:has(select:first-child) select{grid-column:2;grid-row:1}.field label:first-child{grid-column:1;grid-row:1}.field label:first-child+input,.field label:first-child+select{grid-column:2;grid-row:1}.field input,.field select{width:100%;min-width:0;border:1px solid #cddde4;border-radius:10px;padding:12px 10px;background:var(--inputbg);color:var(--ink);border-color:var(--inputborder);outline-color:var(--green)}.field input[readonly]{background:var(--panel);color:var(--red);font-weight:700;border-color:var(--red)}.modalbuttons{display:flex;gap:10px;margin-top:18px}.modalbuttons>*{flex:1}
.menuitem{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;margin:8px 0;text-align:right}
.settingrow{padding:13px 0;border-bottom:1px solid var(--line)}.themegrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.themechoice{display:flex;align-items:center;gap:10px;text-align:right;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel,#fff);color:var(--ink)}.themechoice.chosen{border:2px solid var(--green);font-weight:700}.themechoice span:nth-child(2){flex:1}.swatch{width:28px;height:28px;border-radius:9px;border:1px solid #0002;display:inline-block}@media(min-width:500px){.themegrid{grid-template-columns:1fr 1fr}}.typeitem{display:flex;align-items:center;gap:8px;margin:8px 0}.typeitem span{flex:1}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}.notice{background:var(--noticebg);border-radius:12px;padding:12px;color:var(--noticetext);font-size:12px;line-height:1.7}
@media(min-width:650px){.modalback{align-items:center;padding:16px}.modal{border-radius:20px}.fab{left:auto;width:260px}main{padding-top:22px}}
</style>
<style>
.advance-summary th,.advance-summary td{border:2px solid var(--line);padding:12px 8px;text-align:center}
.advance-summary th{font-weight:700;background:var(--green2)}
</style>
</head>
<body>
<header>
 <div><div class="brand" id="headerTitle">حساباتي</div><div class="subtitle" id="headerSub">إدارة الحسابات والدفاتر</div></div>
 <div class="row"><button class="iconbtn" id="settingsBtn" aria-label="الإعدادات">⚙</button><button class="iconbtn" id="backBtn" aria-label="رجوع" style="display:none">‹</button></div>
</header>
<main id="app"></main>
<button id="mainFab" class="primary fab">＋ إضافة حساب</button>
<div id="modalHost"></div>
<script>
const KEY='hesabati_data_v1';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const localDateTimeNow=()=>{const d=new Date();return `${todayISO()}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`};
const dayName=(iso)=>{if(!iso)return '';const d=new Date(iso+'T12:00:00');return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()]};
const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
let data={accounts:[],types:['بضاعة','خدمة','تركيب','أخرى'],settings:{},nextId:1};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.accounts))data={...data,...saved}}catch(e){}
let view='accounts',activeId=null,modal=null,longTimer=null,longTriggered=false;
function applyTheme(){const t=data.settings?.theme||'green';document.body.classList.remove('theme-blue','theme-purple','theme-dark','theme-sand');if(t!=='green')document.body.classList.add('theme-'+t);const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=({green:'#08785c',blue:'#2459a9',purple:'#7042a6',dark:'#172b3b',sand:'#8b6338'})[t]||'#08785c';}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('تعذر حفظ البيانات على هذا المتصفح. صدّر نسخة احتياطية من الإعدادات.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const account=()=>data.accounts.find(a=>a.id===activeId);
const total=a=>(a?.entries||[]).reduce((t,e)=>({count:t.count+(Number(e.count)||0),price:t.price+(Number(e.price)||0),paid:t.paid+(Number(e.paid)||0),remaining:t.remaining+((Number(e.price)||0)-(Number(e.paid)||0))}),{count:0,price:0,paid:0,remaining:0});
function advanceState(a){
 if(!Array.isArray(a.advances)){
   a.advances=[];
   if(a.advance && Number(a.advance.amount)>0){a.advances.push({id:'adv'+Date.now(),amount:Math.max(0,Number(a.advance.amount)||0),date:a.advance.date||todayISO(),remaining:Math.max(0,Number(a.advance.remaining??a.advance.amount)||0)});}
   delete a.advance;
 }
 a.advances.forEach((adv,i)=>{if(!adv.id)adv.id='adv'+i+'_'+Date.now();adv.amount=Math.max(0,Number(adv.amount)||0);if(!adv.date)adv.date=todayISO();if(!Number.isFinite(Number(adv.remaining)))adv.remaining=adv.amount;});
 return a.advances;
}
function recalculateAdvance(a){
 // أعد الحساب دائمًا من المسلم الأصلي، وبترتيب وقت الحركة ووقت تسجيل كل مقدم.
 const advances=advanceState(a).map((adv,index)=>({...adv,_order:index,_when:adv.createdAt||((adv.date||todayISO())+'T23:59:59')})).sort((x,y)=>String(x._when).localeCompare(String(y._when))||x._order-y._order);
 advances.forEach(adv=>{adv.remaining=Math.max(0,Number(adv.amount)||0)});
 const entries=(a.entries||[]).map((e,index)=>({...e,_order:index,_when:e.createdAt||((e.date||todayISO())+'T23:59:59')})).sort((x,y)=>String(x._when).localeCompare(String(y._when))||x._order-y._order);
 entries.forEach(e=>{
   if(e.basePaid===undefined || e.basePaid===null || !Number.isFinite(Number(e.basePaid))) e.basePaid=Math.max(0,Number(e.paid)||0);
   e.basePaid=Math.max(0,Number(e.basePaid)||0);
   e.paid=e.basePaid;
   delete e._advanceApplied;
 });
 entries.forEach(e=>{
   let due=Math.max(0,(Number(e.price)||0)-e.basePaid);
   if(due<=0)return;
   for(const adv of advances){
     // لا يُخصم المقدم إلا من حركة وقتها أحدث من وقت تسجيل المقدم.
     if(String(e._when)<=String(adv._when))continue;
     if(due<=0)break;
     // تُستهلك المبالغ المقدمة بترتيب تسجيلها؛ لا يُستخدم التالي قبل نفاد السابق.
     const left=Math.max(0,Number(adv.remaining)||0);
     if(left<=0)continue;
     const used=Math.min(left,due);
     e.paid+=used;
     e._advanceApplied=(Number(e._advanceApplied)||0)+used;
     adv.remaining=left-used;
     due-=used;
   }
 });
 entries.forEach(e=>{const original=a.entries.find(x=>x.id===e.id);if(original){original.paid=e.paid;delete original._advanceApplied;delete original._order;delete original._when;}});
 advances.forEach(adv=>{const original=advanceState(a).find(x=>x.id===adv.id);if(original)original.remaining=adv.remaining;});
}
function entryRemaining(e){return (Number(e.price)||0)-(Number(e.paid)||0)}

function header(){const a=account();document.getElementById('headerTitle').textContent=view==='accounts'?'حساباتي':view==='ledger'?(a?.name||'دفتر الحساب'):view==='settings'?'الإعدادات':'إدارة أنواع الحركات';document.getElementById('headerSub').textContent=view==='accounts'?'إدارة الحسابات والدفاتر':'';document.getElementById('backBtn').style.display=view==='accounts'?'none':'inline-block';document.getElementById('settingsBtn').style.display=view==='ledger'?'none':'inline-block';document.getElementById('mainFab').classList.toggle('hidden',view==='settings'||view==='types');document.getElementById('mainFab').textContent=view==='accounts'?'＋ إضافة حساب':'＋ إضافة حركة';}
function render(){applyTheme();header();const root=document.getElementById('app');if(view==='accounts')renderAccounts(root);else if(view==='ledger')renderLedger(root);else if(view==='settings')renderSettings(root);else renderTypes(root)}
function renderAccounts(root){if(!data.accounts.length){root.innerHTML='<div class="card empty"><div style="font-size:36px">▤</div><h2>ابدأ بإضافة أول حساب</h2><p>أنشئ دفترًا مستقلًا لكل شخص أو عميل.</p></div>';return}root.innerHTML=data.accounts.map(a=>`<button class="account" data-open="${a.id}"><span class="avatar">♙</span><span class="name">${esc(a.name)}</span><span class="arrow">‹</span></button>`).join('');root.querySelectorAll('[data-open]').forEach(el=>{const id=el.dataset.open;el.addEventListener('click',()=>{if(longTriggered){longTriggered=false;return}activeId=id;view='ledger';render()});el.addEventListener('contextmenu',e=>{e.preventDefault();showAccountMenu(id)});el.addEventListener('pointerdown',()=>{longTriggered=false;longTimer=setTimeout(()=>{longTriggered=true;showAccountMenu(id)},550)});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(longTimer)))})}
function renderLedger(root){const a=account();if(!a){view='accounts';render();return}recalculateAdvance(a);const advances=advanceState(a);const sum=total(a);const advanceRows=advances.length?advances.map(adv=>`<tr><td style="font-weight:700;color:var(--green)">${money(adv.amount)}</td><td>${esc(adv.date||'')}</td><td style="font-weight:700;color:var(--red)">${money(adv.remaining)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">لا توجد مبالغ مقدمة</td></tr>';const rows=(a.entries||[]).map((e,i)=>`<tr><td>${i+1}</td><td>${esc(dayName(e.date)||e.day||'')}</td><td>${esc(e.date||'')}</td><td>${esc(e.type||'')}</td><td>${money(e.count)}</td><td>${money(e.price)}</td><td class="blue">${money(e.paid)}</td><td class="red">${money((Number(e.price)||0)-(Number(e.paid)||0))}</td><td><div class="actions"><button class="mini edit" data-edit="${e.id}" aria-label="تعديل" title="تعديل">✎</button><button class="mini delete" data-delete="${e.id}" aria-label="حذف" title="حذف">♲</button></div></td></tr>`).join('');
root.innerHTML=`<div class="row between" style="flex-wrap:wrap"><div class="row" style="flex-wrap:wrap;gap:8px"><button class="secondary" id="advanceBtn">＋ إضافة مبلغ مقدم</button><button class="secondary" id="reportBtn">▤ تقرير</button><button class="secondary" id="renameFromLedger" aria-label="خيارات الحساب">⋯</button></div><div style="flex:1;min-width:230px;overflow-x:auto">
<table class="advance-summary" dir="rtl" style="width:100%;min-width:300px;border-collapse:collapse;background:var(--panel)">
<thead><tr><th>المبلغ المقدم</th><th>التاريخ</th><th>المتبقي</th></tr></thead>
<tbody>${advanceRows}</tbody>
</table>
</div></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>رقم</th><th>اليوم</th><th>التاريخ</th><th>النوع</th><th>العدد</th><th>السعر</th><th>مسلم</th><th>باقي</th><th>الإجراءات</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">لا توجد حركات بعد</td></tr>'}</tbody><tfoot><tr><td colspan="4">الإجمالي</td><td>${money(sum.count)}</td><td>${money(sum.price)}</td><td class="blue">${money(sum.paid)}</td><td class="red">${money(sum.remaining)}</td><td>—</td></tr></tfoot></table></div><p class="muted">اضغط على أيقونة القلم للتعديل أو سلة المهملات للحذف.</p>`;
root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEntry(b.dataset.edit));root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirmDeleteEntry(b.dataset.delete));document.getElementById('renameFromLedger').onclick=()=>showAccountMenu(a.id);document.getElementById('reportBtn').onclick=()=>openReport(a);document.getElementById('advanceBtn').onclick=()=>openAdvance(a)}
function openAdvance(a){
 openModal(`<h3>إضافة مبلغ مقدم جديد</h3><p class="muted">يُضاف كل مبلغ مقدم في صف مستقل. لن يبدأ خصمه إلا بعد نفاد المبلغ المقدم السابق، ويُخصم من الحركات التي تاريخها بعد تاريخ تسجيله.</p><div class="field"><input id="advanceAmount" type="number" min="0.01" step="0.01" placeholder="أدخل المبلغ" required><label>المبلغ :-</label></div><div class="field"><input id="advanceDate" type="date" value="${todayISO()}" readonly aria-readonly="true"><label>تاريخ المقدم (تلقائي) :-</label></div><div class="modalbuttons"><button class="primary" id="saveAdvance">حفظ</button><button class="secondary" id="cancelAdvance">إلغاء</button></div>`);
 document.getElementById('cancelAdvance').onclick=closeModal;
 document.getElementById('saveAdvance').onclick=()=>{
   const amount=Number(document.getElementById('advanceAmount').value),date=todayISO();
   if(!Number.isFinite(amount)||amount<=0){alert('أدخل مبلغًا مقدمًا أكبر من صفر');return}
   const advances=advanceState(a);
   (a.entries||[]).forEach(e=>{if(e.basePaid===undefined)e.basePaid=Math.max(0,Number(e.paid)||0)});
   advances.push({id:'adv'+Date.now()+Math.random().toString(16).slice(2,6),amount,date,createdAt:localDateTimeNow(),remaining:amount});
   recalculateAdvance(a);save();closeModal();render();
 };
}
function openReport(a){recalculateAdvance(a);const sum=total(a);const entries=[...(a.entries||[])];const rows=entries.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.date||'')}</td><td>${esc(dayName(e.date)||e.day||'')}</td><td>${esc(e.type||'')}</td><td>${money(e.count)}</td><td>${money(e.price)}</td><td>${money(e.paid)}</td><td>${money((Number(e.price)||0)-(Number(e.paid)||0))}</td></tr>`).join('');openModal(`<div id="reportContent"><h3 style="text-align:center">تقرير حساب: ${esc(a.name)}</h3><p class="muted" style="text-align:center">تاريخ التقرير: ${todayISO()}</p><div class="tablewrap"><table style="min-width:600px"><thead><tr><th>رقم</th><th>التاريخ</th><th>اليوم</th><th>النوع</th><th>العدد</th><th>السعر</th><th>مسلم</th><th>باقي</th></tr></thead><tbody>${rows||'<tr><td colspan="8">لا توجد حركات مسجلة</td></tr>'}</tbody><tfoot><tr><td colspan="4">الإجمالي</td><td>${money(sum.count)}</td><td>${money(sum.price)}</td><td>${money(sum.paid)}</td><td>${money(sum.remaining)}</td></tr></tfoot></table></div></div><div class="modalbuttons"><button class="primary" id="printReport">طباعة التقرير</button><button class="secondary" id="closeReport">إغلاق</button></div>`);document.getElementById('closeReport').onclick=closeModal;document.getElementById('printReport').onclick=()=>{const content=document.getElementById('reportContent').innerHTML;const w=window.open('','_blank');if(!w){alert('المتصفح منع نافذة الطباعة. اسمح بالنوافذ المنبثقة ثم حاول مرة أخرى.');return}w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقرير ${esc(a.name)}</title><style>body{font-family:Tahoma,Arial;padding:20px;color:#111}h3{text-align:center}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #555;padding:8px;text-align:center}th,tfoot td{background:#eee;font-weight:bold}@media print{button{display:none}}</style></head><body>${content}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}}
function renderSettings(root){const current=data.settings?.theme||'green';const themes=[['green','أخضر زمردي','#08785c'],['blue','أزرق هادئ','#2459a9'],['purple','بنفسجي أنيق','#7042a6'],['sand','رملي دافئ','#8b6338'],['dark','داكن ليلي','#172b3b']];root.innerHTML=`<div class="card"><button class="menuitem" id="typesPage"><span>☷</span><span><b>إدارة أنواع الحركات</b><br><small class="muted">إضافة الأنواع وتعديلها وحذفها</small></span><span>‹</span></button><div class="settingrow"><b>مظهر التطبيق</b><p class="muted">اختر اللون الذي يناسبك، وسيتم حفظ اختيارك.</p><div class="themegrid">${themes.map(([id,name,color])=>`<button class="themechoice ${current===id?'chosen':''}" data-theme="${id}"><span class="swatch" style="background:${color}"></span><span>${name}</span><span>${current===id?'✓':''}</span></button>`).join('')}</div></div></div>`;document.getElementById('typesPage').onclick=()=>{view='types';render()};root.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{data.settings=data.settings||{};data.settings.theme=b.dataset.theme;save();render()})}
function renderTypes(root){root.innerHTML=`<div class="card"><div class="row between"><h2>أنواع الحركات</h2><button class="primary" id="addType">＋ إضافة نوع</button></div><div id="typesList">${data.types.map((t,i)=>`<div class="typeitem"><span>${esc(t)}</span><button class="mini edit" data-typeedit="${i}" aria-label="تعديل النوع">✎</button><button class="mini delete" data-typedelete="${i}" aria-label="حذف النوع">♲</button></div>`).join('')||'<p class="empty">لا توجد أنواع</p>'}</div></div><div class="notice">حذف النوع من القائمة لا يغيّر أسماء الأنواع في الحركات القديمة.</div>`;
document.getElementById('addType').onclick=()=>openType();root.querySelectorAll('[data-typeedit]').forEach(b=>b.onclick=()=>openType(Number(b.dataset.typeedit)));root.querySelectorAll('[data-typedelete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.typedelete);openConfirm('حذف النوع',`هل تريد حذف النوع «${data.types[i]}» من قائمة الاختيار؟`,()=>{data.types.splice(i,1);save();render()})})}
function openModal(content){document.getElementById('modalHost').innerHTML=`<div class="modalback" id="modalback"><section class="modal" role="dialog">${content}</section></div>`;document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()})}
function closeModal(){document.getElementById('modalHost').innerHTML='';modal=null}
function handleBack(){if(document.getElementById('modalback')){closeModal();return}if(view==='ledger'){view='accounts';activeId=null}else if(view==='types'){view='settings'}else if(view==='settings'){view='accounts'}else{return}render()}
function showAccountMenu(id){const a=data.accounts.find(x=>x.id===id);if(!a)return;openModal(`<h3>${esc(a.name)}</h3><button class="menuitem" id="renameAccount">✎　إعادة التسمية</button><button class="menuitem" id="deleteAccount" style="color:var(--red)">♲　حذف الحساب</button><button class="secondary wide" id="cancelMenu">إلغاء</button>`);document.getElementById('renameAccount').onclick=()=>{closeModal();openRename(id)};document.getElementById('deleteAccount').onclick=()=>{closeModal();openConfirm('حذف الحساب',`هل تريد حذف «${a.name}» وجميع حركاته؟ لا يمكن التراجع عن هذا الإجراء.`,()=>{data.accounts=data.accounts.filter(x=>x.id!==id);if(activeId===id){activeId=null;view='accounts'}save();render()})};document.getElementById('cancelMenu').onclick=closeModal}
function openRename(id){const a=data.accounts.find(x=>x.id===id);openModal(`<h3>إعادة تسمية الحساب</h3><div class="field"><input id="renameValue" value="${esc(a.name)}" maxlength="80"><label>اسم الحساب :-</label></div><div class="modalbuttons"><button class="primary" id="saveRename">حفظ</button><button class="secondary" id="cancelRename">إلغاء</button></div>`);document.getElementById('saveRename').onclick=()=>{const n=document.getElementById('renameValue').value.trim();if(!n){alert('اكتب اسم الحساب');return}a.name=n;save();closeModal();render()};document.getElementById('cancelRename').onclick=closeModal}
function openEntry(id=null){const a=account();const old=id?(a.entries||[]).find(e=>e.id===id):null;const date=old?.date||todayISO();const options=data.types.map(t=>`<option ${t===(old?.type||data.types[0])?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('');openModal(`<h3>${old?'تعديل حركة':'إضافة حركة'} — ${esc(a.name)}</h3><form id="entryForm"><div class="field"><select id="entryDay">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map(d=>`<option ${d===dayName(date)?'selected':''}>${d}</option>`).join('')}</select><label>اليوم :-</label></div><div class="field"><input id="entryDate" type="date" value="${date}" required><label>التاريخ :-</label></div><div class="field"><select id="entryType">${options}</select><label>النوع :-</label></div><div class="field"><input id="entryCount" type="number" min="0" step="1" placeholder="00" value="${old?esc(old.count):''}" required><label>العدد :-</label></div><div class="field"><input id="entryPrice" type="number" min="0" step="1" placeholder="00" value="${old?esc(old.price):''}" required><label>السعر :-</label></div><div class="field"><input id="entryPaid" type="number" min="0" step="1" placeholder="00" value="${old?esc(old.paid):''}" required><label>مسلم :-</label></div><div class="field"><input id="entryRemaining" readonly value="${money((Number(old?.price)||0)-(Number(old?.paid)||0))}" placeholder="00"><label>باقي :-</label></div><div class="modalbuttons"><button class="primary" type="submit">حفظ</button><button class="secondary" type="button" id="cancelEntry">إلغاء</button></div></form>`);
const dateEl=document.getElementById('entryDate'),dayEl=document.getElementById('entryDay');dateEl.onchange=()=>{if(dateEl.value)dayEl.value=dayName(dateEl.value)};dayEl.onchange=()=>{};const update=()=>{document.getElementById('entryRemaining').value=money((Number(document.getElementById('entryPrice').value)||0)-(Number(document.getElementById('entryPaid').value)||0))};document.getElementById('entryPrice').oninput=update;document.getElementById('entryPaid').oninput=update;
document.getElementById('cancelEntry').onclick=closeModal;document.getElementById('entryForm').onsubmit=e=>{e.preventDefault();const p=Number(document.getElementById('entryPrice').value),paid=Number(document.getElementById('entryPaid').value);if(paid>p){if(!confirm('المبلغ المسلم أكبر من السعر. هل تريد المتابعة؟'))return}if(!Number.isFinite(p)||p<=0){alert('لا يمكن حفظ الحركة إذا كان السعر يساوي صفرًا أو أقل. أدخل سعرًا أكبر من صفر.');document.getElementById('entryPrice').focus();return}
const now=new Date();const localTime=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');const createdAt=old?.createdAt||(dateEl.value+'T'+localTime);const entry={id:old?.id||('e'+Date.now()+Math.random().toString(16).slice(2,6)),day:dayEl.value,date:dateEl.value,createdAt,type:document.getElementById('entryType').value,count:Number(document.getElementById('entryCount').value)||0,price:p,paid,basePaid:old?(Number(old.basePaid??old.paid)||0):paid};if(old){a.entries[a.entries.findIndex(e=>e.id===old.id)]=entry}else{a.entries.push(entry)}recalculateAdvance(a);save();closeModal();render()}}
function confirmDeleteEntry(id){openConfirm('تأكيد حذف الحركة','هل أنت متأكد من حذف هذه الحركة؟ سيتم تحديث الإجماليات تلقائيًا.',()=>{const a=account();a.entries=a.entries.filter(e=>e.id!==id);save();render()})}
function openConfirm(title,body,yes){openModal(`<h3 style="text-align:center;color:var(--red)">♲</h3><h3 style="text-align:center">${esc(title)}</h3><p style="text-align:center;line-height:1.8">${esc(body)}</p><div class="modalbuttons"><button class="danger" id="confirmYes">تأكيد الحذف</button><button class="secondary" id="confirmNo">إلغاء</button></div>`);document.getElementById('confirmYes').onclick=()=>{closeModal();yes()};document.getElementById('confirmNo').onclick=closeModal}
function openType(index=null){const old=index===null?'':data.types[index];openModal(`<h3>${index===null?'إضافة نوع جديد':'تعديل النوع'}</h3><div class="field"><input id="typeValue" maxlength="50" value="${esc(old)}" placeholder="مثال: صيانة"><label>النوع :-</label></div><div class="modalbuttons"><button class="primary" id="typeSave">حفظ</button><button class="secondary" id="typeCancel">إلغاء</button></div>`);document.getElementById('typeSave').onclick=()=>{const v=document.getElementById('typeValue').value.trim();if(!v){alert('أدخل اسم النوع');return}if(data.types.some((t,i)=>t===v&&i!==index)){alert('هذا النوع موجود بالفعل');return}if(index===null)data.types.push(v);else data.types[index]=v;save();closeModal();render()};document.getElementById('typeCancel').onclick=closeModal}
function exportBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='hesabati-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(url)}
function importBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.accounts)||!Array.isArray(v.types))throw Error();if(!confirm('سيتم استبدال البيانات الحالية بمحتوى النسخة الاحتياطية. هل تريد المتابعة؟'))return;data=v;save();render();alert('تم استيراد النسخة الاحتياطية')}catch(err){alert('الملف غير صالح أو ليس نسخة احتياطية من التطبيق')}};r.readAsText(file);e.target.value=''}
document.getElementById('mainFab').onclick=()=>{if(view==='accounts'){openModal(`<h3>إضافة حساب جديد</h3><div class="field"><label for="newAccountName">الاسم :-</label><input id="newAccountName" maxlength="80" placeholder="مثال: حساب علي"></div><div class="modalbuttons"><button class="primary" id="createAccount">حفظ</button><button class="secondary" id="cancelAccount">إلغاء</button></div>`);document.getElementById('createAccount').onclick=()=>{const name=document.getElementById('newAccountName').value.trim();if(!name){alert('اكتب اسم الحساب');return}const a={id:'a'+Date.now(),name,entries:[]};data.accounts.push(a);activeId=a.id;save();closeModal();view='ledger';render()};document.getElementById('cancelAccount').onclick=closeModal}else if(view==='ledger')openEntry()};
document.getElementById('settingsBtn').onclick=()=>{view='settings';render()};document.getElementById('backBtn').onclick=handleBack;window.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){if(e.target.matches('input,textarea,select'))return;handleBack()}});
render();
</script>
</body>
</html>
